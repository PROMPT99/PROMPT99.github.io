<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Play — Photosphere</title><style>*{box-sizing:border-box} :root{color-scheme:dark}body{margin:0;background:#050505;color:#eee;font-family:Consolas,"Courier New",monospace}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle at 12% 24%,#ffffff55 1px,transparent 1.5px),radial-gradient(circle at 75% 65%,#ffffff33 1px,transparent 1.5px);background-size:237px 241px,319px 277px;z-index:-1}header{min-height:96px;padding:28px 5%;display:flex;justify-content:space-between;align-items:center;gap:24px;border-bottom:1px solid #252525}.brand{font-size:20px;font-weight:bold;letter-spacing:3px;text-decoration:none}a{color:inherit}nav{display:flex;gap:26px}nav a{text-decoration:none;color:#aaa;font-size:13px}nav a:hover,nav a[aria-current]{color:white}a:focus-visible,button:focus-visible,canvas:focus-visible{outline:2px solid white;outline-offset:5px}main{width:min(1120px,90%);margin:70px auto} .eyebrow{font-size:11px;letter-spacing:3px;color:#aaa;text-transform:uppercase}h1{font-size:clamp(36px,6vw,66px);font-weight:400;letter-spacing:-3px;margin:18px 0 24px}p{color:#bbb;line-height:1.85} .intro{max-width:700px;font-size:18px}.frame{border:1px dashed #666;padding:36px;margin-top:44px;background:#080808}h2{font-size:20px;font-weight:400;margin:0 0 16px}.row{display:grid;grid-template-columns:180px 1fr;gap:36px;padding:28px 0;border-top:1px solid #333}.row:first-child{border-top:0;padding-top:0}.row:last-child{padding-bottom:0}.row p{margin:0;max-width:690px;font-family:Arial,sans-serif;font-size:17px}footer{width:90%;margin:60px auto 24px;display:flex;justify-content:space-between;gap:20px;border-top:1px solid #252525;padding-top:20px;color:#777;font-size:11px;letter-spacing:1px}button{font:inherit;border:1px solid #555;background:#101010;color:white;padding:12px 20px;cursor:pointer}button:hover{background:#242424}button.primary{background:#eee;color:#080808;border-color:#eee}button:disabled{opacity:.4;cursor:default}@media(max-width:620px){header{align-items:flex-start;flex-direction:column;gap:20px;padding:24px 5%}main{margin-top:40px}.frame{padding:24px}.row{grid-template-columns:1fr;gap:2px}h1{letter-spacing:-2px}.intro{font-size:16px}footer{flex-direction:column}}.game{border:1px dashed #666;margin-top:40px;background:#080808}.scoreboard{display:flex;gap:50px;padding:22px 28px;border-bottom:1px solid #333;color:#999;font-size:10px;letter-spacing:2px}.scoreboard strong{display:block;color:#eee;font-size:23px;font-weight:400;margin-top:8px;font-variant-numeric:tabular-nums}.field{position:relative}canvas{display:block;width:100%;height:auto;min-height:220px;touch-action:manipulation;image-rendering:pixelated}#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#080808dc;text-align:center}#overlay[hidden]{display:none}#overlay h2{font-size:clamp(22px,3vw,32px);margin:0}.controls{padding:20px 28px;display:flex;align-items:center;gap:12px;border-top:1px solid #333;flex-wrap:wrap}.controls span{margin-left:auto;font-size:11px;color:#999;line-height:1.8}.note{font-size:12px;line-height:1.7;margin:18px 0 0}@media(max-width:620px){.scoreboard{gap:30px;padding:18px}.controls{padding:18px}.controls span{width:100%;margin:0}canvas{min-height:240px}}.logo-header{min-height:100px;padding:14px 28px;border:0;display:block}.brand-logo{display:block;width:clamp(170px,26vw,320px);max-width:calc(100vw - 56px);height:auto}.logo-header a{display:inline-block}main{margin-top:36px}.game{border:3px solid #fff;background:#000}.interaction-box{margin-top:18px;min-height:120px;border:4px solid #fff;background:#000;display:flex;align-items:center;gap:clamp(24px,8vw,100px);padding:24px 30px}.menu-choice{position:relative;border:0;background:none!important;color:white;padding:12px 0;font:24px "Courier New",monospace;display:flex;align-items:center;gap:18px;text-align:left}.cursor{visibility:hidden;font-size:24px;color:#fff}.menu-choice.selected .cursor{visibility:visible}.menu-choice:focus-visible{outline:1px dashed #aaa;outline-offset:8px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}@media(max-width:500px){.interaction-box{gap:24px;padding:18px 16px;min-height:100px}.menu-choice{font-size:19px;gap:10px}}</style></head><body><header class="logo-header"><a href="./index.html" aria-label="Photosphere home"><img class="brand-logo" src="./ascii-art-text__1_-removebg-preview.png" alt="Photosphere"></a></header><main><h1>Octopus run.</h1><p class="intro">Five cacti. One lap at a time. Jump over each cactus, reach the edge, and start a new route.</p><section class="game" aria-label="Octopus jumping game"><div class="scoreboard"><div>SCORE<strong id="score">00000</strong></div><div>BEST<strong id="best">00000</strong></div><div>LAP<strong id="lap">01</strong></div></div><div class="field"><canvas id="canvas" width="1200" height="360" tabindex="0" aria-label="Octopus run. Press Space to jump, P to pause. Arrow keys select menu actions; Enter confirms. Avoid five stationary cacti.">Your browser needs canvas support to play.</canvas><div id="overlay"><span class="eyebrow" id="state">READY WHEN YOU ARE</span><h2 id="message">Take the first leap.</h2></div></div></section><div class="interaction-box" role="group" aria-label="Game menu. Use arrow keys to select, Enter to confirm. Space to jump."><button type="button" class="menu-choice selected" id="action" tabindex="0"><span class="cursor" aria-hidden="true">♥</span><span id="action-label">Start</span></button><button type="button" class="menu-choice" id="retry" tabindex="-1"><span class="cursor" aria-hidden="true">♥</span>Restart</button></div><span id="status" role="status" class="sr-only"></span></main><script>
(()=>{'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),W=1200,H=360,ground=285;
let mode='ready',x=-50,y=0,vy=0,score=0,best=0,lap=1,cacti=[],last=0,elapsed=0;
try{best=Math.max(0,Math.floor(Number(localStorage.getItem('photosphere-octopus-best'))||0))}catch(e){}
const runner=new Image(),cactusImage=new Image();
// Reuse the original site's sprite sheets when present beside this HTML.
runner.src='./DinoSpriteSheet.png';cactusImage.src='./CactusSpriteSheet.png';
const pixels=['000111111000','001111111100','011111111110','111111111111','111001100111','111001100111','111111111111','011111111110','110110110011','110110110011'];
function arrange(){cacti=Array.from({length:5},(_,i)=>({x:190+i*190+Math.random()*45,w:30,h:42,passed:false}));}
function hud(){$('score').textContent=String(score).padStart(5,'0');$('best').textContent=String(best).padStart(5,'0');$('lap').textContent=String(lap).padStart(2,'0');}
function award(n){score+=n;if(score>best){best=score;try{localStorage.setItem('photosphere-octopus-best',String(best))}catch(e){}}hud();}
function setMode(next){mode=next;$('overlay').hidden=mode==='running';$('action-label').textContent=mode==='running'?'Pause':mode==='paused'?'Resume':'Start';if(mode==='paused'){$('state').textContent='PAUSED';$('message').textContent='Catch your breath.';$('status').textContent='Paused.'}if(mode==='over'){$('state').textContent='RUN COMPLETE';$('message').textContent='Score: '+score;$('status').textContent='Game over. Select Start or Restart to try again.'}}
function reset(){x=-50;y=0;vy=0;score=0;lap=1;elapsed=0;arrange();hud();setMode('running');$('status').textContent='Run started. Jump over the five cacti.';}
function jump(){if(mode==='running'&&y===0)vy=560;}
function pause(){if(mode==='running')setMode('paused');else if(mode==='paused'){setMode('running');$('status').textContent='Run resumed.';}}
function update(dt){if(mode!=='running')return;elapsed+=dt;x+=220*dt;y+=vy*dt;vy-=1700*dt;if(y<=0){y=0;vy=0;}
for(const c of cacti){if(x+39>c.x+4&&x+7<c.x+c.w-4&&y<c.h-5){setMode('over');return;}if(!c.passed&&x>c.x+c.w){c.passed=true;award(10);}}
if(x>W+46){x=-50;y=0;vy=0;lap++;award(50);arrange();$('status').textContent='Lap '+lap+'. New cactus positions.';}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#080808';ctx.fillRect(0,0,W,H);ctx.fillStyle='#555';for(let i=0;i<26;i++)ctx.fillRect((i*173+27)%W,30+(i*47)%160,1,1);ctx.strokeStyle='#666';ctx.beginPath();ctx.moveTo(0,ground+.5);ctx.lineTo(W,ground+.5);ctx.stroke();ctx.fillStyle='#292929';for(let i=0;i<55;i++)ctx.fillRect((i*83)%W,ground+9+(i*17)%32,3,1);
cacti.forEach((c,i)=>{if(cactusImage.complete&&cactusImage.naturalWidth){let s=cactusImage.naturalWidth/150;ctx.drawImage(cactusImage,i*30*s,9*s,30*s,42*s,c.x,ground-42,30,42);}else{ctx.fillStyle='#aaa';ctx.fillRect(c.x+12,ground-42,8,42);ctx.fillRect(c.x+2,ground-31,6,18);ctx.fillRect(c.x+6,ground-19,10,6);ctx.fillRect(c.x+24,ground-36,6,17);ctx.fillRect(c.x+18,ground-25,10,6);}});
ctx.imageSmoothingEnabled=false;const px=Math.round(x),py=Math.round(ground-y-50);if(runner.complete&&runner.naturalWidth){let sw=runner.naturalWidth/3;let f=y>0?0:Math.floor(elapsed/.14)%3;ctx.drawImage(runner,f*sw,0,sw,runner.naturalHeight,px,py-9,46,59);}else{ctx.fillStyle='#aaa';pixels.forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1'){let wiggle=j>7&&y===0?((Math.floor(elapsed*8)%2)*2):0;ctx.fillRect(px+i*4,py+j*4+wiggle,4,4)}}));}}
function frame(t){const dt=last?Math.min((t-last)/1000,.05):0;last=t;const steps=Math.max(1,Math.ceil(dt/.008));for(let i=0;i<steps;i++)update(dt/steps);draw();requestAnimationFrame(frame);}
const choices=[$('action'),$('retry')];let selection=0;
function selectMenu(index,focus=true){selection=(index+choices.length)%choices.length;choices.forEach((item,i)=>{item.classList.toggle('selected',i===selection);item.tabIndex=i===selection?0:-1;});if(focus)choices[selection].focus({preventScroll:true});}
function activate(index){if(index===1||mode==='ready'||mode==='over')reset();else pause();}
choices.forEach((item,i)=>{item.addEventListener('focus',()=>selectMenu(i,false));item.addEventListener('click',()=>{selectMenu(i);activate(i);});});
canvas.addEventListener('pointerdown',()=>{canvas.focus();jump();});
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();if(!e.repeat)selectMenu(selection+(['ArrowLeft','ArrowUp'].includes(e.code)?-1:1));return;}if(e.code==='Enter'&&!['BUTTON','A'].includes(document.activeElement.tagName)){e.preventDefault();if(!e.repeat)activate(selection);return;}if(e.code==='Space'){if(document.activeElement.tagName==='A')return;e.preventDefault();if(!e.repeat){if(mode==='ready'||mode==='over')reset();else jump();}return;}if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();if(!e.repeat)pause();}if(e.code==='KeyR'&&!e.repeat)reset();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='running')setMode('paused');});window.addEventListener('blur',()=>{if(mode==='running')setMode('paused');});
arrange();hud();requestAnimationFrame(frame);
})();
</script></body></html>
